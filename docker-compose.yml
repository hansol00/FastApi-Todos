services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app-011
    ports:
      - "5011:8000"
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    healthcheck:                  # v3.0.0: /health 응답으로 컨테이너 상태 판정
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거