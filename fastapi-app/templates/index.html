<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        :root {
            --paper:     #FAF8FF;   /* 배경 — 아주 옅은 보라빛 흰색 */
            --card:      #FFFFFF;
            --ink:       #332C45;   /* 본문 — 깊은 자두빛 */
            --ink-soft:  #7A7190;   /* 보조 텍스트 */
            --lilac:     #C9BCF0;   /* 진행 중 */
            --lilac-dim: #EDE8FB;
            --mint:      #8FD3BB;   /* 완료 */
            --coral:     #F08A72;   /* 기한 지남 */
            --coral-dim: #FDEDE8;
            --line:      #EDE8F7;
            --radius:    14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Pretendard, "Pretendard Variable", -apple-system,
                         "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            background: var(--paper);
            color: var(--ink);
            max-width: 42rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 머리말 ─────────────────────────────── */
        header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -.02em;
            margin: 0;
        }
        #version { font-size: .8rem; font-weight: 500; color: var(--ink-soft); }
        #health {
            margin-left: auto;
            font-size: .78rem;
            color: var(--ink-soft);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: .2rem .7rem;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            white-space: nowrap;
        }
        #health .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #CFC9DB; }
        #health.ok  .dot { background: var(--mint); }
        #health.bad .dot { background: var(--coral); }
        #health.bad { color: var(--coral); border-color: var(--coral-dim); }

        /* ── 진행 상황 ──────────────────────────── */
        #progress {
            margin: 1.5rem 0 .9rem;
            height: .6rem;
            border-radius: 999px;
            background: var(--lilac-dim);
            overflow: hidden;
            display: flex;
        }
        #progress span { height: 100%; transition: width .35s ease; }
        #bar-done    { background: var(--mint); }
        #bar-overdue { background: var(--coral); }

        #stats { display: flex; gap: 2.25rem; margin-bottom: 2.1rem; }
        #stats div { display: flex; flex-direction: column; }
        #stats b { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
        #stats small { font-size: .78rem; color: var(--ink-soft); }
        #stats .done b    { color: #4FA98A; }
        #stats .overdue b { color: var(--coral); }
        #count {
            display: block;
            font-size: .82rem;
            color: var(--ink-soft);
            margin-top: -1.3rem;
            margin-bottom: 1.6rem;
        }

        /* ── 입력 ───────────────────────────────── */
        form {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: .9rem;
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        input[type="text"], input[type="date"] {
            font: inherit;
            font-size: .92rem;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: .55rem .7rem;
        }
        input[type="text"] { flex: 1 1 11rem; min-width: 0; }
        input[type="date"] { flex: 0 1 auto; color: var(--ink-soft); }
        input::placeholder { color: #ADA5C0; }
        input:focus-visible, button:focus-visible {
            outline: 2px solid var(--lilac);
            outline-offset: 1px;
        }
        form button {
            font: inherit;
            font-weight: 600;
            font-size: .92rem;
            color: var(--ink);
            background: var(--lilac);
            border: none;
            border-radius: 9px;
            padding: .55rem 1.1rem;
            cursor: pointer;
        }
        form button:hover { background: #BBAAEC; }

        /* ── 필터 ───────────────────────────────── */
        #toolbar { display: flex; gap: .4rem; margin-bottom: .75rem; }
        #toolbar button {
            font: inherit;
            font-size: .85rem;
            color: var(--ink-soft);
            background: none;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: .3rem .85rem;
            cursor: pointer;
        }
        #toolbar button:hover { color: var(--ink); }
        #search {
          margin-left: auto; min-width: 11rem; padding: .3rem .55rem;
          border: 1px solid var(--line); border-radius: 6px;
          background: transparent; color: var(--ink); font: inherit;
        }
        #toolbar button[aria-pressed="true"] {
            color: var(--ink);
            font-weight: 600;
            background: var(--card);
            border-color: var(--line);
        }

        /* ── 목록 ───────────────────────────────── */
        ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
        li {
            display: flex;
            align-items: center;
            gap: .7rem;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--lilac);
            border-radius: var(--radius);
            padding: .7rem .9rem;
        }
        li.is-done    { border-left-color: var(--mint); }
        li.is-overdue { border-left-color: var(--coral); background: var(--coral-dim); }

        /* ── v8.0.0: 선택 삭제 모드 ──────────────── */
        body.selecting li { cursor: pointer; }
        body.selecting li.is-selected { outline: 2px solid var(--coral); background: var(--coral-dim); }
        li input[type="checkbox"].select { accent-color: #C85B42; }   /* 완료(초록)와 구분 */
        #select-mode { border-color: var(--line) !important; }
        /* 선택 모드 작업 바: 목록이 길어도 화면 아래에 붙어 있어 스크롤 없이 누를 수 있다 */
        #select-bar {
            position: sticky;
            bottom: .75rem;
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-top: .75rem;
            padding: .55rem .7rem .55rem 1rem;
            background: var(--card);
            border: 1px solid var(--coral);
            border-radius: var(--radius);
            box-shadow: 0 6px 20px rgba(60, 40, 90, .12);
        }
        #select-bar[hidden] { display: none; }   /* display:flex 가 hidden 속성을 덮어쓰지 않게 */
        #select-count { font-size: .9rem; font-weight: 600; color: #C85B42; margin-right: auto; }
        #select-bar button {
            font: inherit;
            font-size: .85rem;
            color: var(--ink-soft);
            background: none;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: .3rem .8rem;
            cursor: pointer;
        }
        #select-bar button:hover { color: var(--ink); border-color: var(--lilac); }
        #delete-selected { color: #fff !important; background: #C85B42 !important; border-color: #C85B42 !important; }
        #delete-selected:disabled { opacity: .4; cursor: not-allowed; }

        li input[type="checkbox"] {
            width: 1.05rem; height: 1.05rem;
            accent-color: #4FA98A;
            flex: none;
            cursor: pointer;
        }
        li span { flex: 1; min-width: 0; font-size: .95rem; }
        .done { text-decoration: line-through; color: var(--ink-soft); }
        .overdue { color: #C85B42; font-weight: 600; }
        .due {
            display: inline-block;
            margin-left: .5rem;
            font-size: .74rem;
            font-weight: 500;
            color: var(--ink-soft);
            background: var(--paper);
            border-radius: 999px;
            padding: .1rem .5rem;
            white-space: nowrap;
        }
        .overdue .due { color: #C85B42; background: #FBDDD5; }

        li button {
            font: inherit;
            font-size: .8rem;
            color: var(--ink-soft);
            background: none;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: .25rem .6rem;
            cursor: pointer;
            flex: none;
        }
        li button:hover { color: var(--ink); border-color: var(--lilac); }

        #empty { color: var(--ink-soft); font-size: .92rem; padding: 2rem 0; text-align: center; }
        #error { color: #C85B42; background: var(--coral-dim); border-radius: 9px; padding: .6rem .8rem; font-size: .9rem; }

        @media (max-width: 30rem) {
            #stats { gap: 1.25rem; }
            li button { padding: .25rem .45rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            #progress span { transition: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1>To-Do List</h1>
        <span id="version"></span>
        <span id="health" title="/health 응답"><span class="dot"></span><span id="health-text">확인 중…</span></span>
    </header>

    <div id="progress">
        <span id="bar-done" style="width:0"></span>
        <span id="bar-overdue" style="width:0"></span>
    </div>
    <div id="stats">
        <div class="done"><b id="stat-done">0</b><small>완료</small></div>
        <div class="overdue"><b id="stat-overdue">0</b><small>기한 지남</small></div>
    </div>
    <span id="count" aria-live="polite"></span>

    <form id="todo-form">
        <input type="text" id="title" placeholder="할 일 (예: 운영체제 과제)" required>
        <input type="text" id="description" placeholder="설명 (선택)">
        <input type="date" id="due_date" title="마감일 (선택)">
        <button type="submit">할 일 추가</button>
    </form>

    <div id="toolbar">
        <button data-filter="all" aria-pressed="true">전체</button>
        <button data-filter="active" aria-pressed="false">진행 중</button>
        <button data-filter="done" aria-pressed="false">완료</button>
        <button id="select-mode" type="button">선택 삭제</button>   <!-- v8.0.0 -->
        <input type="search" id="search" placeholder="검색 (제목·설명)"
               autocomplete="off" aria-label="할 일 검색">
    </div>

    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <p id="empty" hidden>아직 등록된 할 일이 없습니다. 위에서 첫 항목을 추가해 보세요.</p>
    <!-- v8.0.0: 선택 삭제 모드에서만 보이는 작업 바 (화면 아래에 고정) -->
    <div id="select-bar" hidden role="toolbar" aria-label="선택 항목 작업">
        <span id="select-count" aria-live="polite">0개 선택됨</span>
        <button id="select-all" type="button">전체 선택</button>
        <button id="delete-selected" type="button" disabled>선택한 항목 삭제</button>
        <button id="select-cancel" type="button">취소</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), countEl = $("count"), emptyEl = $("empty");
        let allTodos = [];      // 서버에서 받은 전체 목록
        let filter = "all";     // all | active | done
        let query = "";         // v6.0.0: 검색어 (서버에 ?q= 로 전달)
        let selecting = false;  // v8.0.0: 선택 삭제 모드
        let selected = new Set();   // v8.0.0: 선택한 할 일 id

        // 오늘 날짜를 YYYY-MM-DD(로컬 시간)로 — 마감일 문자열과 바로 비교할 수 있다
        const today = () => new Date().toLocaleDateString("sv-SE");
        const isOverdue = (t) => !t.completed && t.due_date && t.due_date < today();

        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        // v6.0.0: 검색어가 있으면 서버에서 걸러 받는다 (GET /todos?q=...)
        const load = () => run("목록 불러오기", async () => {
          const qs = query ? `?q=${encodeURIComponent(query)}` : "";
          allTodos = await api(`/todos${qs}`);
          render();
        });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        // v5.2.0: 전체·완료·남은 할 일·기한 지남 집계와 진행 막대
        function renderStats() {
          const total = allTodos.length;
          const done = allTodos.filter((t) => t.completed).length;
          const overdue = allTodos.filter(isOverdue).length;
          const left = total - done;

          $("stat-done").textContent = done;
          $("stat-overdue").textContent = overdue;

          const pct = (n) => (total ? (n / total) * 100 : 0);
          $("bar-done").style.width = `${pct(done)}%`;
          $("bar-overdue").style.width = `${pct(overdue)}%`;

          countEl.textContent = `남은 할 일 ${left}개 / 전체 ${total}개`;
        }

        function render() {
          renderStats();

          const shown = allTodos.filter((t) =>
            filter === "all" ? true : filter === "done" ? t.completed : !t.completed);

          emptyEl.hidden = shown.length > 0;
          emptyEl.textContent = allTodos.length === 0
            ? "아직 등록된 할 일이 없습니다. 위에서 첫 항목을 추가해 보세요."
            : "이 조건에 해당하는 할 일이 없습니다.";

          // v8.0.0: 화면에 보이는 항목만 선택 대상으로 남긴다 (필터·검색으로 숨은 항목은 지우지 않는다)
          shownIds = shown.map((t) => t.id);
          selected = new Set([...selected].filter((id) => shownIds.includes(id)));
          renderFooter();

          listEl.replaceChildren(...shown.map((todo) => {
            // v8.0.0: 선택 모드에서는 체크박스가 '완료' 가 아니라 '선택' 을 뜻한다
            const check = selecting
              ? Object.assign(document.createElement("input"), {
                  type: "checkbox",
                  className: "select",
                  checked: selected.has(todo.id),
                  ariaLabel: `${todo.title} 선택`,
                  onchange: () => toggleSelect(todo.id),
                })
              : Object.assign(document.createElement("input"), {
                  type: "checkbox",
                  checked: todo.completed,
                  onchange: () => save(todo.id, { ...todo, completed: check.checked }),
                });
            const overdue = isOverdue(todo);
            const text = document.createElement("span");
            text.className = todo.completed ? "done" : overdue ? "overdue" : "";
            // [fix] 설명이 비어 있으면 "—" 구분자를 붙이지 않는다
            text.textContent = todo.description ? `${todo.title} — ${todo.description}` : todo.title;
            if (todo.due_date) {
              const due = Object.assign(document.createElement("small"), {
                className: "due",
                textContent: overdue ? `⚠ 마감 ${todo.due_date} (기한 지남)` : `마감 ${todo.due_date}`,
              });
              text.append(due);
            }
            const li = document.createElement("li");
            li.className = todo.completed ? "is-done" : overdue ? "is-overdue" : "";
            if (selecting) {
              // 선택 모드: 행 아무 곳이나 눌러도 선택되고, 수정·삭제 버튼은 숨긴다
              li.classList.toggle("is-selected", selected.has(todo.id));
              li.onclick = (event) => { if (event.target !== check) toggleSelect(todo.id); };
              li.append(check, text);
            } else {
              li.append(check, text, button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
            }
            return li;
          }));
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;
          const description = prompt("새 설명:", todo.description);
          if (description === null) return;
          const due = prompt("마감일 (YYYY-MM-DD, 비우면 없음):", todo.due_date ?? "");
          if (due === null) return;
          save(todo.id, { ...todo, title: title.trim(), description: description.trim(), due_date: due.trim() || null });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        // v8.0.0: 선택 삭제 ───────────────────────────────────────
        let shownIds = [];      // 지금 화면에 보이는 항목 id (전체 선택 대상)
        const BULK_LIMIT = 100; // 서버 main.py 의 MAX_BULK_DELETE 와 같은 값

        function renderFooter() {
          $("select-mode").hidden = selecting || allTodos.length === 0;
          $("select-bar").hidden = !selecting;
          $("select-count").textContent = `${selected.size}개 선택됨`;
          $("delete-selected").disabled = selected.size === 0;
          const allPicked = shownIds.length > 0 && selected.size === shownIds.length;
          $("select-all").textContent = allPicked ? "선택 해제" : "전체 선택";
          $("select-all").disabled = shownIds.length === 0;
          document.body.classList.toggle("selecting", selecting);
        }

        function toggleSelect(id) {
          selected.has(id) ? selected.delete(id) : selected.add(id);
          render();
        }

        function setSelecting(on) {
          selecting = on;
          selected = new Set();
          render();
        }

        $("select-mode").onclick = () => setSelecting(true);
        $("select-cancel").onclick = () => setSelecting(false);
        // 전체 선택 ↔ 선택 해제 (필터·검색으로 보이는 항목만 대상)
        $("select-all").onclick = () => {
          selected = selected.size === shownIds.length ? new Set() : new Set(shownIds);
          render();
        };
        // Esc 로 선택 모드 끝내기
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && selecting) setSelecting(false);
        });
        $("delete-selected").onclick = () => {
          if (selected.size === 0) return;
          if (!confirm(`선택한 할 일 ${selected.size}개를 삭제할까요?`)) return;
          // DELETE /todos?ids=1&ids=3 — 서버는 한 요청 안에서 전부 지우거나, 없는 id 가 있으면 하나도 안 지운다.
          // 서버는 한 번에 최대 BULK_LIMIT 개만 받으므로(초과 시 422), 그보다 많이 고르면 나눠서 보낸다.
          const ids = [...selected];
          let done = 0;
          run("선택 항목 삭제", async () => {
            try {
              for (let i = 0; i < ids.length; i += BULK_LIMIT) {
                const chunk = ids.slice(i, i + BULK_LIMIT);
                await api(`/todos?${chunk.map((id) => `ids=${id}`).join("&")}`, "DELETE");
                done += chunk.length;
              }
            } catch (e) {
              // 앞 묶음은 이미 지워졌을 수 있으니 몇 개까지 지웠는지 함께 알린다
              throw done ? new Error(`${done}개 삭제 후 중단 — ${e.message}`) : e;
            } finally {
              selecting = false;          // 성공·실패 모두 선택 모드를 끝내고 최신 목록을 다시 받는다
              selected = new Set();
              await load();
            }
          });
        };

        // v6.0.0: 입력이 멈춘 뒤에만 요청해 타이핑마다 호출되는 것을 막는다
        let searchTimer;
        $("search").addEventListener("input", (event) => {
          query = event.target.value.trim();
          clearTimeout(searchTimer);
          searchTimer = setTimeout(load, 250);
        });

        document.querySelectorAll("#toolbar button[data-filter]").forEach((btn) => {
          btn.onclick = () => {
            filter = btn.dataset.filter;
            document.querySelectorAll("#toolbar button[data-filter]").forEach((b) =>
              b.setAttribute("aria-pressed", String(b === btn)));
            render();
          };
        });

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              due_date: $("due_date").value || null,
            });
            event.target.reset();
            await load();
          });
        };

        // v3.0.0: /health 를 주기적으로 호출해 서버 상태를 배지로 표시
        async function checkHealth() {
          const badge = $("health"), label = $("health-text");
          try {
            const res = await fetch("/health", { cache: "no-store" });
            const info = await res.json();
            badge.className = res.ok ? "ok" : "bad";
            // v5.2.0: 버전을 하드코딩하지 않고 /health 응답에서 읽는다
            if (info.version) $("version").textContent = `v${info.version}`;
            label.textContent = res.ok
              ? `정상 · ${Math.round(info.uptime_seconds)}초 가동`
              : `이상 (${info.storage ?? "unknown"})`;
          } catch {
            badge.className = "bad";
            label.textContent = "서버 응답 없음";
          }
        }

        load();
        checkHealth();
        setInterval(checkHealth, 15000);
    </script>
</body>
</html>
