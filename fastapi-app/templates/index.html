<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] { flex: 1 1 12rem; padding: .5rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #e5e5e5; }
        li span { flex: 1; }
        .done { text-decoration: line-through; color: #888; }
        .overdue { color: #b00020; font-weight: 600; }
        .due { font-size: .85em; color: #666; margin-left: .4rem; }
        .overdue .due { color: #b00020; }
        #toolbar { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
        #toolbar button[aria-pressed="true"] { font-weight: 700; text-decoration: underline; }
        #count { margin-left: auto; color: #555; }
        #error { color: #b00020; }
    </style>
</head>
<body>
    <h1>To-Do List <small style="font-size:.5em;color:#888">v2.0.0</small></h1>
    <form id="todo-form">
        <input type="text" id="title" placeholder="제목 (예: 20231234)" required>
        <input type="text" id="description" placeholder="설명 (예: 홍길동)">
        <input type="date" id="due_date" title="마감일 (선택)">
        <button type="submit">Add To-Do</button>
    </form>
    <div id="toolbar">
        <button data-filter="all" aria-pressed="true">전체</button>
        <button data-filter="active" aria-pressed="false">진행 중</button>
        <button data-filter="done" aria-pressed="false">완료</button>
        <span id="count"></span>
    </div>
    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), countEl = $("count");
        let allTodos = [];      // 서버에서 받은 전체 목록
        let filter = "all";     // all | active | done

        // 오늘 날짜를 YYYY-MM-DD(로컬 시간)로 — 마감일 문자열과 바로 비교할 수 있다
        const today = () => new Date().toLocaleDateString("sv-SE");

        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => { allTodos = await api("/todos"); render(); });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        function render() {
          const remaining = allTodos.filter((t) => !t.completed).length;
          countEl.textContent = `남은 할 일 ${remaining}개 / 전체 ${allTodos.length}개`;

          const shown = allTodos.filter((t) =>
            filter === "all" ? true : filter === "done" ? t.completed : !t.completed);

          listEl.replaceChildren(...shown.map((todo) => {
            const check = Object.assign(document.createElement("input"), {
              type: "checkbox",
              checked: todo.completed,
              onchange: () => save(todo.id, { ...todo, completed: check.checked }),
            });
            const overdue = !todo.completed && todo.due_date && todo.due_date < today();
            const text = document.createElement("span");
            text.className = todo.completed ? "done" : overdue ? "overdue" : "";
            // [fix] 설명이 비어 있으면 "—" 구분자를 붙이지 않는다
            text.textContent = todo.description ? `${todo.title} — ${todo.description}` : todo.title;
            if (todo.due_date) {
              const due = Object.assign(document.createElement("small"), {
                className: "due",
                textContent: overdue ? `⚠ 마감 ${todo.due_date} (기한 지남)` : `마감 ${todo.due_date}`,
              });
              text.append(due);
            }
            const li = document.createElement("li");
            li.append(check, text, button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
            return li;
          }));
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;
          const description = prompt("새 설명:", todo.description);
          if (description === null) return;
          const due = prompt("마감일 (YYYY-MM-DD, 비우면 없음):", todo.due_date ?? "");
          if (due === null) return;
          save(todo.id, { ...todo, title: title.trim(), description: description.trim(), due_date: due.trim() || null });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        document.querySelectorAll("#toolbar button").forEach((btn) => {
          btn.onclick = () => {
            filter = btn.dataset.filter;
            document.querySelectorAll("#toolbar button").forEach((b) =>
              b.setAttribute("aria-pressed", String(b === btn)));
            render();
          };
        });

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              due_date: $("due_date").value || null,
            });
            event.target.reset();
            await load();
          });
        };

        load();
    </script>
</body>
</html>
