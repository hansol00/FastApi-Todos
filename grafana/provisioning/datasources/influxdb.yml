# v7.0.0: Grafana 데이터소스를 파일로 등록(provisioning).
# UI에서 손으로 추가하면 컨테이너를 지웠을 때 사라지고, 과제 재현도 안 된다.
apiVersion: 1

datasources:
  # JMeter Backend Listener 가 실시간으로 밀어넣는 부하 테스트 결과
  - name: InfluxDB-JMeter
    type: influxdb
    access: proxy
    url: http://influxdb-011:8086      # 컨테이너 이름 기준 (호스트 포트 8086 아님)
    database: jmeter
    isDefault: false
    editable: true
    jsonData:
      httpMode: GET
      dbName: jmeter

  # #7 주차에서 쓰던 Prometheus 도 같이 파일로 고정해 둔다.
  # 이미 UI로 추가해 두었다면 이름만 겹치지 않으면 둘 다 남는다.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-011:9090
    isDefault: true
    editable: true
